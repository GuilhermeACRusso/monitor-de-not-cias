name: Monitor de Notícias

on:
  schedule:
    - cron: '0 10 * * 1-5'  # 07:00 BRT (UTC-3)
    - cron: '0 15 * * 1-5'  # 12:00 BRT
    - cron: '0 20 * * 1-5'  # 17:00 BRT
    - cron: '0 23 * * 1-5'  # 20:00 BRT
  workflow_dispatch:

# Required to commit news_ledger.csv and the news_graph_*.csv files
# back to the repo.
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # bumped to 40 minutes — source count grew from 12 (v1.0) to 39 (v1.4)
    # (12 -> 39), and several of the new local/regional sources are
    # best-effort RSS guesses that may fall through to the slower
    # Playwright HTML-scraping path.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run Monitor
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push ledger and graph
        run: |
          git config --global user.name "News Monitor Bot"
          git config --global user.email "bot@example.com"
          git add news_ledger.csv news_graph_entities.csv news_graph_relationships.csv news_graph_events.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update news ledger and entity graph"
          git push
