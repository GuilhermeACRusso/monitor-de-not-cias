name: Monitor de Notícias

on:
  schedule:
    # v1.5: minutes offset away from :00 on purpose. GitHub documents
    # that scheduled workflows are delayed most right at the top of
    # every hour, since that's when every other repo's cron jobs also
    # fire — landing at :17/:22/:38/:53 avoids that specific congestion
    # spike. Times below are still ~07:00/12:00/17:00/20:00 BRT, just
    # not exactly on the hour.
    - cron: '17 10 * * 1-5'  # ~07:17 BRT (morning digest, 24h lookback)
    - cron: '22 15 * * 1-5'  # ~12:22 BRT
    - cron: '38 20 * * 1-5'  # ~17:38 BRT
    - cron: '53 23 * * 1-5'  # ~20:53 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run Monitor
        run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # v1.5: tells the script exactly which cron fired, so it can
          # pick the correct lookback window (24h morning vs 10h
          # otherwise) deterministically — immune to how late GitHub
          # actually started the job. Empty string on manual
          # workflow_dispatch runs, which the script handles separately.
          RUN_SCHEDULE: ${{ github.event.schedule }}

      - name: Commit and push ledger and graph
        run: |
          git config --global user.name "News Monitor Bot"
          git config --global user.email "bot@example.com"
          git add news_ledger.csv news_graph_entities.csv news_graph_relationships.csv news_graph_events.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update news ledger and entity graph"
          git push
